[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "comment-crawler-skill"
version = "0.1.0"
description = "Chinese-first multi-platform comment collection skill and CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "comment-crawler contributors"}]
dependencies = []

[project.optional-dependencies]
browser = ["playwright==1.61.0"]
analysis = ["openpyxl>=3.1"]

[project.scripts]
comment-crawler = "comment_crawler.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["comment_crawler*"]
